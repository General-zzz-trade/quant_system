name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  CARGO_TERM_COLOR: always

jobs:
  local-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline fault-injection checks (stdlib only)
        run: python scripts/check_local_safety.py

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ruff==0.17.4 import-linter==2.16 mypy==1.18.2

      - name: Architecture contracts (.importlinter)
        run: lint-imports

      - name: Type check the trading package (strict section in pyproject.toml)
        run: mypy trading/

      - name: Ruff check (core modules)
        run: |
          ruff check --select E,W,F \
            decision/ engine/ event/ state/ execution/ features/ trading/ \
            tests/architecture/ tests/characterization/ tests/unit/lab/ tests/contract/ tests/unit/trading/ \
            shared/kill_file.py shared/exposure_gate.py \
            risk/ alpha/ attribution/ runner/ \
            monitoring/ infra/ strategy/ polymarket/ \
            shared/confirmed_execution.py shared/drawdown_guard.py shared/entry_risk.py \
            shared/execution_journal.py shared/strategy_position.py shared/execution_lease.py \
            shared/runtime_state.py shared/runtime_backup.py \
            shared/portfolio_reservations.py scripts/portfolio_risk_state.py \
            shared/account_ledger.py scripts/account_ledger_state.py \
            shared/runtime_migration.py shared/risk_group_backup.py \
            shared/runtime_status.py shared/release_acceptance.py \
            scripts/check_runtime_health.py scripts/check_release_acceptance.py \
            scripts/migrate_runtime_state.py scripts/risk_group_backup.py scripts/check_execution_runtime.py \
            data/quality/causal_bars.py tests/unit/runner/test_offline_research.py \
            data/oi_cache.py tests/unit/runner/test_data_readiness.py tests/unit/runner/test_paper_check.py \
            tests/unit/runner/test_shadow_main.py tests/offline/ scripts/check_local_safety.py \
            scripts/check_ci_security.py scripts/check_deploy_scope.py \
            scripts/check_runtime_state.py scripts/check_paper_runtime.py scripts/runtime_state_backup.py \
            scripts/check_runtime_recovery.py tests/fixtures/runtime_recovery_worker.py \
            scripts/run_bybit_alpha.py tests/unit/runner/test_startup_check.py \
            tests/unit/bybit/test_order_confirmation.py tests/unit/bybit/test_durable_execution.py \
            tests/unit/execution/test_bybit_execution_adapter.py tests/unit/execution/test_adapter_exceptions.py

  rust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The crate links libpython3.12 (PyO3). Newer runner images no longer ship
      # that shared library, so provide it explicitly.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@1.93.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run Rust tests
        env:
          PYO3_PYTHON: python
        run: |
          export RUSTFLAGS="-L ${pythonLocation}/lib"
          export LD_LIBRARY_PATH="${pythonLocation}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo test --locked

  container-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the installed native wheel and runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ci
          load: true
          push: false
          tags: quant-ci:startup-check
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Startup check with networking disabled
        run: >-
          docker run --rm --network none --entrypoint python
          quant-ci:startup-check -m runner.alpha_main --check-startup
      - name: Container startup regression tests
        run: >-
          docker run --rm --network none quant-ci:startup-check
          python -m pytest tests/unit/runner/test_startup_check.py tests/unit/runner/test_shadow_main.py -q --tb=short
      - name: Offline paper data-to-signal contract
        run: >-
          docker run --rm --network none --entrypoint python
          quant-ci:startup-check -m runner.alpha_main --check-paper-contract
      - name: Container stdlib offline safety checks
        run: docker run --rm --network none quant-ci:startup-check python scripts/check_local_safety.py
      - name: Persistent state survives container recreation (offline)
        run: python3 -m scripts.check_runtime_recovery --image quant-ci:startup-check
      - name: Synthetic replay without network, keys or external models
        run: >-
          docker run --rm --network none --entrypoint python
          quant-ci:startup-check -m runner.offline demo --out /tmp/offline-startup

  python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: dtolnay/rust-toolchain@1.93.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Python dependencies
        run: |
          pip install maturin==1.12.6 pytest==9.0.2 pytest-cov==7.0.0
          pip install --require-hashes -r requirements/container.lock

      - name: Build Rust extension
        run: |
          maturin build --locked --release --features python --out dist/
          pip install dist/*.whl --force-reinstall
          python3 -c "from _quant_hotpath import RustFeatureEngine, RustStateStore, RustInferenceBridge"

      - name: Run core unit tests
        run: |
          python3 -m pytest \
            tests/unit/decision/ \
            tests/unit/state/ \
            tests/unit/event/ \
            tests/unit/engine/ \
            tests/unit/bybit/ \
            tests/unit/execution/test_bybit_execution_adapter.py \
            tests/unit/execution/test_adapter_exceptions.py \
            tests/unit/execution/adapters/okx/ \
            tests/unit/runner/test_portfolio_risk_file.py \
            tests/unit/runner/test_offline_research.py \
            tests/unit/runner/test_data_readiness.py tests/unit/runner/test_paper_check.py \
            tests/unit/runner/test_shadow_main.py \
            tests/unit/infra/test_model_signing.py \
            tests/unit/binance/ \
            tests/unit/monitoring/test_pause_state_fail_closed.py \
            tests/unit/runner/test_offline_candidate_research.py \
            tests/unit/data/test_binance_public_download.py \
            tests/unit/features/test_daily_alignment_causal.py \
            tests/unit/lab/ \
            tests/architecture/ \
            tests/characterization/ \
            tests/offline/ \
            tests/contract/ \
            tests/unit/trading/ \
            -x -q --tb=short

      - name: Binance execution coverage gate
        run: |
          python3 -m pytest tests/unit/binance/ -q --tb=short \
            --cov=execution.adapters.binance.adapter --cov=execution.adapters.binance.execution_adapter \
            --cov=execution.adapters.binance.protective_stops --cov=runner.binance_main \
            --cov=runner.binance_context --cov=shared.confirmed_execution --cov=shared.kill_file \
            --cov=trading.application.risk --cov=trading.application.execution --cov=trading.adapters.sqlite \
            --cov=trading.domain.risk --cov=trading.domain.orders --cov-report=term --cov-fail-under=75

      - name: Synthetic offline research acceptance (no network or account keys)
        run: python3 -m runner.offline demo --out .cache/offline-ci

      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-offline-validation
          path: .cache/offline-ci/
          retention-days: 14

      - name: Frozen 2025 BTC research sample (historical evaluation, no network)
        run: >-
          python3 -m runner.offline study
          --bars research/datasets/btcusdt_2025/bars.csv
          --funding research/datasets/btcusdt_2025/funding.csv
          --out .cache/btc-2025-ci

      - uses: actions/upload-artifact@v4
        with:
          name: btc-2025-research-validation
          path: .cache/btc-2025-ci/
          retention-days: 14

  # The whole suite (everything `make test-all` runs), split into shards that run at the same time.
  # scripts/ci_shard.py deals every test file to exactly one shard; tests/architecture checks that.
  python-test-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: dtolnay/rust-toolchain@1.93.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Python dependencies
        run: |
          pip install maturin==1.12.6 pytest==9.0.2 pytest-cov==7.0.0
          pip install --require-hashes -r requirements/container.lock

      - name: Build Rust extension
        run: |
          maturin build --locked --release --features python --out dist/
          pip install dist/*.whl --force-reinstall

      - name: Run one shard of the whole suite
        run: python3 -m pytest $(python3 scripts/ci_shard.py ${{ matrix.shard }} 4) -q --tb=short

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tracked credential assignments and private-key file names
        run: python3 -B scripts/check_ci_security.py

name: Deploy

# Deployment is explicit during local development; CI must never restart a service.
on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Deploy the reviewed master revision to the configured server
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, quant-server]
    if: ${{ inputs.confirm_deploy && github.ref == 'refs/heads/master' }}
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DEPLOY_SERVICES: quant-paper
      GH_TOKEN: ${{ github.token }}
      QUANT_RELEASE_REVISION: ${{ github.sha }}
      QUANT_RELEASE_REPOSITORY: ${{ github.repository }}
      QUANT_RELEASE_IMAGE: quant-paper:latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Require successful CI for this exact master commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import urllib.request

          sha = os.environ["GITHUB_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          url = f"https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100"
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response)["workflow_runs"]
          passed = any(
              run["head_sha"] == sha and run["head_branch"] == "master"
              and run["path"] == ".github/workflows/ci.yml" and run["event"] == "push"
              and run["status"] == "completed" and run["conclusion"] == "success"
              for run in runs
          )
          if not passed:
              raise SystemExit("Deployment blocked: this master commit has no successful completed CI run")
          print("Verified successful CI for", sha)

      - name: Resolve previous deployed revision
        id: changes
        run: |
          STATE="$HOME/.local/state/quant-system/quant-paper-last-good-deploy"
          if [ -f "$STATE" ]; then
            PREV=$(cat "$STATE")
          else
            PREV=$(git rev-parse HEAD~1)
          fi
          git cat-file -e "$PREV^{commit}"
          echo "prev_commit=$PREV" >> "$GITHUB_OUTPUT"
          echo "Changes since $PREV:"
          git diff --name-only "$PREV" HEAD

      - name: Guard deploy scope
        id: scope_guard
        run: |
          PREV="${{ steps.changes.outputs.prev_commit }}"
          CHANGED="$(git diff --name-only "$PREV" HEAD)"
          printf '%s\n' "$CHANGED" | python3 -m scripts.check_deploy_scope --guard-changed-files-stdin

      - name: Validate paper deployment prerequisites (no restart)
        run: bash scripts/deploy.sh --check "$DEPLOY_SERVICES"

      - name: Backup current paper image
        id: backup
        run: |
          if docker image inspect quant-paper:latest >/dev/null 2>&1; then
            docker tag quant-paper:latest quant-paper:rollback
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Backed up quant-paper:latest -> quant-paper:rollback"
          fi

      - name: Docker build
        id: docker_build
        run: docker compose build --no-cache "$DEPLOY_SERVICES"

      - name: Rolling deploy
        id: rolling_deploy
        run: bash scripts/deploy.sh "$DEPLOY_SERVICES"

      - name: Record successful deploy
        if: success()
        run: |
          STATE="$HOME/.local/state/quant-system/quant-paper-last-good-deploy"
          mkdir -p "$(dirname "$STATE")"
          cp .cache/release/postflight.json "$STATE.release.tmp"
          mv "$STATE.release.tmp" "$STATE.release.json"
          git rev-parse HEAD > "$STATE.tmp"
          mv "$STATE.tmp" "$STATE"

      - name: Rollback on failure
        if: ${{ failure() && steps.rolling_deploy.conclusion == 'failure' && steps.rolling_deploy.outputs.service_change_started == 'true' }}
        run: |
          echo "Deploy failed; rolling back"
          PREV="${{ steps.changes.outputs.prev_commit }}"
          if [ "${{ steps.backup.outputs.available }}" != true ]; then
            echo "Rollback FAILED: no image backed up by this deployment" >&2
            exit 1
          fi
          export QUANT_RELEASE_BASELINE="$HOME/.local/state/quant-system/quant-paper-last-good-deploy.release.json"
          if [ ! -f "$QUANT_RELEASE_BASELINE" ]; then
            echo "Rollback FAILED: no previous accepted release evidence" >&2
            exit 1
          fi
          export QUANT_RELEASE_REVISION="$PREV"
          export QUANT_RELEASE_IMAGE=quant-paper:latest
          docker tag quant-paper:rollback quant-paper:latest
          bash scripts/deploy.sh "$DEPLOY_SERVICES"
          # Notify
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"*[DEPLOY FAILED]* Rolled back to ${PREV}\n$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"parse_mode\":\"Markdown\"}" || true
          fi

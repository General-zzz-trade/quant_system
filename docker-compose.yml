version: "3.8"

services:
  quant-paper:
    image: ${QUANT_RELEASE_IMAGE:-quant-paper:latest}
    build:
      context: .
      target: paper
      args:
        VCS_REF: ${QUANT_RELEASE_REVISION:-unknown}
    command: ["python3", "-m", "scripts.run_bybit_alpha", "--symbols", "BTCUSDT", "ETHUSDT", "ETHUSDT_15m", "SUIUSDT", "AXSUSDT", "--ws", "--dry-run"]
    env_file: .env
    environment:
      - BYBIT_BASE_URL=https://api-demo.bybit.com
      - RUNTIME_STATE_DIR=/app/data/runtime
      - ORDER_JOURNAL_PATH=/app/data/runtime/orders.sqlite
      - DRAWDOWN_STATE_PATH=/app/data/runtime/drawdown.sqlite
      - RISK_SCOPE=${QUANT_PAPER_RISK_SCOPE:-}
      - QUANT_RELEASE_REVISION=${QUANT_RELEASE_REVISION:-}
      - QUANT_RELEASE_IMAGE_ID=${QUANT_RELEASE_IMAGE_ID:-}
      - QUANT_RELEASE_INPUT_DIGEST=${QUANT_RELEASE_INPUT_DIGEST:-}
    volumes:
      - ./data_files:/app/data_files:ro
      - ./models_v8:/app/models_v8:ro
      - ./logs:/app/logs
      - type: bind
        # Unconfigured paper state fails preflight/startup without affecting other profiles.
        source: ${QUANT_PAPER_STATE_DIR:-/var/lib/quant-system/paper-state-not-configured}
        target: /app/data/runtime
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-m", "scripts.check_runtime_health", "--require", "ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  quant-live:
    image: quant-live:latest
    build:
      context: .
      target: live
    command: ["python3", "-m", "scripts.run_bybit_alpha", "--symbols", "BTCUSDT", "ETHUSDT", "ETHUSDT_15m", "SUIUSDT", "AXSUSDT", "--ws"]
    env_file: .env
    environment:
      - BYBIT_BASE_URL=https://api.bybit.com
    volumes:
      - ./data_files:/app/data_files:ro
      - ./models_v8:/app/models_v8:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import importlib; importlib.import_module('_quant_hotpath'); importlib.import_module('scripts.run_bybit_alpha')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    profiles:
      - live  # Only starts with: docker compose --profile live up

  # Experimental: LiveRunner framework path (not current production)
  quant-framework:
    image: quant-framework:latest
    build:
      context: .
      target: paper
    command: ["python3", "-m", "runner.live_runner", "--config", "/app/infra/config/examples/live.yaml"]
    env_file: .env
    environment:
      - BYBIT_BASE_URL=https://api-demo.bybit.com
    volumes:
      - ./data_files:/app/data_files:ro
      - ./models_v8:/app/models_v8:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import importlib; importlib.import_module('runner.live_runner')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    profiles:
      - framework  # Only starts with: docker compose --profile framework up

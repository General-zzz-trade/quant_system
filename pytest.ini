[pytest]
testpaths =
    tests
addopts = -q --tb=short -m "not benchmark and not slow" --import-mode=importlib
markers =
    benchmark: performance benchmark tests (deselect with '-m "not benchmark"')
    performance: hot-path performance regression tests
    slow: longer-running tests
    known_defect: pins a current defect from docs/arch/current-state.md; changed only by an approved fix

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "quant-system"
version = "0.2.0"
description = "Event-driven quantitative trading system for crypto perpetual futures"
requires-python = ">=3.11"
license = {text = "Proprietary"}

# The runtime and the lab use numpy and pandas (installed with the system Python on the host); the groups below are
# older optional sets, not checked against today's imports (2026-11-17: listed in the execution log, not changed here).
dependencies = []

[project.optional-dependencies]
live = [
    "websocket-client>=1.6",
    "python-dotenv>=1.0",
]
config = [
    "pyyaml>=6.0",
]
data = [
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<3.0",
    "pyarrow>=14.0",
]
research = [
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<3.0",
    "pyarrow>=14.0",
    "yfinance>=0.2.31",
    "ccxt>=4.0",
    "matplotlib>=3.8",
    "scipy>=1.10",
]
async = [
    "aiohttp>=3.9",
    "websockets>=12.0",
]
ml = [
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.1",
]
dl = [
    "torch>=2.1",
    "transformers>=4.36",
]
optimization = [
    "cvxpy>=1.4",
]
monitoring = [
    "prometheus-client>=0.19",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-timeout>=2.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "hypothesis>=6.92",
]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-timeout>=2.1",
    "hypothesis>=6.92",
]

# Python source wheel (there is no native extension since 2026-11-15).
# Explicit discovery is required because this repository has no quant_system/
# package matching the distribution name. Do not follow legacy scripts/ links.
[tool.hatch.build.targets.wheel]
# /data/ is ignored by Git for local datasets, but data/ also contains code.
ignore-vcs = true
# packages/only-include bypass include filters in Hatch; constrain by file here.
include = [
    "/data/**/*.py", "/data/**/py.typed",
    "/infra/**/*.py", "/infra/**/py.typed",
    "/monitoring/**/*.py", "/monitoring/**/py.typed",
    "/lab/**/*.py", "/lab/**/py.typed",
    "/trading/**/*.py", "/trading/**/py.typed",
    "/runner/**/*.py", "/runner/**/py.typed",
]
exclude = ["**/tests/**", "**/archive/**", "**/__pycache__/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-q --tb=short --import-mode=importlib"
markers = [
    "benchmark: performance benchmark tests (deselect with '-m \"not benchmark\"')",
    "slow: longer-running tests",
]

[tool.coverage.run]
# The packages that exist (2026-11-17: the legacy ones were deleted on 2026-11-15). CI names its own money-path
# packages with --cov; this list is for a local run.
source = ["trading", "lab", "data", "infra", "monitoring", "runner"]
omit = ["*/tests/*", "*/archive/*", "scripts/*", "ext/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
exclude_lines = ["pragma: no cover", "if __name__", "raise NotImplementedError"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # gradual adoption — new code must have full annotations

[[tool.mypy.overrides]]
# numpy and pandas stubs need a newer Python than the 3.11 target; trading/ treats them as Any.
module = ["numpy", "numpy.*", "pandas", "pandas.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["trading", "trading.*"]
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
no_implicit_optional = true

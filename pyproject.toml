[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "quant-system"
version = "0.2.0"
description = "Event-driven quantitative trading system for crypto perpetual futures"
requires-python = ">=3.11"
license = {text = "Proprietary"}

# Zero external dependencies for core logic — only stdlib.
# Optional groups below add functionality for specific environments.
dependencies = []

[project.optional-dependencies]
live = [
    "websocket-client>=1.6",
    "python-dotenv>=1.0",
]
config = [
    "pyyaml>=6.0",
]
data = [
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<3.0",
    "pyarrow>=14.0",
]
research = [
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<3.0",
    "pyarrow>=14.0",
    "yfinance>=0.2.31",
    "ccxt>=4.0",
    "matplotlib>=3.8",
    "scipy>=1.10",
]
async = [
    "aiohttp>=3.9",
    "websockets>=12.0",
]
ml = [
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.1",
]
dl = [
    "torch>=2.1",
    "transformers>=4.36",
]
optimization = [
    "cvxpy>=1.4",
]
monitoring = [
    "prometheus-client>=0.19",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-timeout>=2.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "hypothesis>=6.92",
]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-timeout>=2.1",
    "hypothesis>=6.92",
]

# Python source wheel only. Build/install the native _quant_hotpath wheel
# separately with maturin; Docker uses these sources plus that native wheel.
# Explicit discovery is required because this repository has no quant_system/
# package matching the distribution name. Do not follow legacy scripts/ links.
[tool.hatch.build.targets.wheel]
# /data/ is ignored by Git for local datasets, but data/ also contains code.
ignore-vcs = true
# packages/only-include bypass include filters in Hatch; constrain by file here.
include = [
    "/alpha/**/*.py", "/alpha/**/py.typed",
    "/attribution/**/*.py", "/attribution/**/py.typed",
    "/data/**/*.py", "/data/**/py.typed",
    "/decision/**/*.py", "/decision/**/py.typed",
    "/engine/**/*.py", "/engine/**/py.typed",
    "/event/**/*.py", "/event/**/py.typed",
    "/execution/**/*.py", "/execution/**/py.typed",
    "/features/**/*.py", "/features/**/py.typed",
    "/infra/**/*.py", "/infra/**/py.typed",
    "/monitoring/**/*.py", "/monitoring/**/py.typed",
    "/polymarket/**/*.py", "/polymarket/**/py.typed",
    "/research/**/*.py", "/research/**/py.typed",
    "/risk/**/*.py", "/risk/**/py.typed",
    "/lab/**/*.py", "/lab/**/py.typed",
    "/runner/**/*.py", "/runner/**/py.typed",
    "/shared/**/*.py", "/shared/**/py.typed",
    "/state/**/*.py", "/state/**/py.typed",
    "/strategy/**/*.py", "/strategy/**/py.typed",
]
exclude = ["**/tests/**", "**/archive/**", "**/__pycache__/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-q --tb=short --import-mode=importlib"
markers = [
    "benchmark: performance benchmark tests (deselect with '-m \"not benchmark\"')",
    "slow: longer-running tests",
]

[tool.coverage.run]
source = ["alpha", "core", "data", "decision", "engine", "event",
          "execution", "features", "infra", "monitoring", "policy",
          "lab", "portfolio", "regime", "risk", "runner", "shared", "state"]
omit = ["*/tests/*", "*/archive/*", "scripts/*", "ext/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
exclude_lines = ["pragma: no cover", "if __name__", "raise NotImplementedError"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # gradual adoption — new code must have full annotations

[[tool.mypy.overrides]]
module = ["core.*", "regime.*", "state.*", "decision.*", "engine.*", "event.*", "features.*", "execution.*", "alpha.*", "attribution.*"]
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["runner.backtest.*"]
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["_quant_hotpath", "_quant_hotpath.*"]
ignore_missing_imports = true
